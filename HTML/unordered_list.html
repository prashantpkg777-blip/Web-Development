<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unordered List</title>
</head>
<body>
  <ul type="circle">
    <h3>Fruits</h3>
    <h4><li>Mango</li>
    <li>Apple</li>
    <li>Banana</li>
    <li>Grapes</li>
    <li>Orange</li>
    <ul type="square">
      <li>Banana 1</li>
      <li>Banana 2</li>
      <li>Banana 3</li>
    </ul></h4>
  </ul>
  
</body>
</html>
