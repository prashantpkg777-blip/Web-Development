<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscript and Superscript</title>
</head>
<body>
  <p>(a+b)2 = a2 + b2 + 2ab</p><br>
  <p>(a+b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab</p>
  <hr>
  <p>H2O is the chemical formula for water.</p><br>
  <p>H<sub>2</sub>O is the chemical formula for water

  
</body>
</html>
