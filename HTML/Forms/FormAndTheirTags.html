<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
</head>
<body>
  <form action="contact.php" target="_blank" method="post">
    <label for="Username">Username:</label>
    <input type="text" placeholder="email id" required>
    <br><br>
    <label for="password">Password:</label>
    <input type="password" placeholder="password" required>
    <br><br>
    <label for="date">Birthdate:</label>
    <input type="date" id="date" name="date">
    <br><br>
    File: <input type="file">
    <br><br>
    Color: <input type="color">
    <br><br>
    Range: <input type="range" min="0" max="100">
    <br><br>
    Button: <input type="button" value="Click Me">
    <br><br>
    3D Button: <input type="button" value="3D Button" style="border: 2px outset buttonhighlight; padding: 5px;">
    <br><br>
    2D Button: <input type="button" value="2D Button" style="border: 2px solid black; padding: 5px;">
    <br><br>
    

    <input type="submit" value="Login">
    <input type="reset" value="Reset">
  </form>
  
</body>
</html>
