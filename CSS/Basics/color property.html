<!DOCTYPE html>
<html lang="en">
<head>
  <title>Color property</title>
  <style>
    h1 {
      color: blue;
    }
    p {
      color: rgb(153, 254, 2);
    }
  </style>
</head>
<body>
  <h1>This is a heading</h1>
  <p>This is a paragraph.</p>
  <h1 style="color: pink;">This is another heading</h1>
</body>
</html>
