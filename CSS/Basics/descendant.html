<!DOCTYPE html>
<html lang="en">
<head>
  <title>Descendant selector</title>
  <style>
    #first h1 {
      color: green;
    }
    #first p {
      color: purple;
    }
    p {
      color: orange;
    }
  </style>
</head>
<body>
  <div id="first">
    <h1>Heading 1</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Architecto amet aliquid accusamus impedit culpa sequi ipsam qui vero neque, ut animi iusto perferendis veniam ullam voluptate dolore possimus eaque quia.</p>
  </div>

  <p>second Paragraph</p>
  
</body>
</html>
