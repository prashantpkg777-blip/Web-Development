<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Id selector</title>
  <style>
    /* id selector only used for unique elements */
    #first {
      color: seagreen;
    }
    /* class selector used for multiple elements */
    .second {
      color: coral;
    }
  </style>
</head>
<body>
  <div id="first">First div</div>
  <div class ="second">Second div</div>
  <p class ="second">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquid, temporibus!</p>
</body>
</html>
