<!DOCTYPE html>
<html lang="en">
<head>
  <title>Font Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+US+Trad+Guides&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Playwrite+US+Trad+Guides&display=swap" rel="stylesheet">
  <style>
    #first { 
     font-family: "Playwrite US Trad Guides", cursive;
     font-weight: 400;
     font-style: normal;
    }
    #second {
      font-family: "Bungee Spice", sans-serif;
      font-weight: 400;
      font-style: normal;

    }

  </style>
</head>
<body>
  <p id="first">Lorem ipsum dolor sit amet consectetur adipisicing elit. Animi, culpa?</p>
  <br>
  <p id="second">Lorem ipsum dolor sit amet consectetur adipisicing elit. Expedita, enim?</p>
  
</body>
</html>
