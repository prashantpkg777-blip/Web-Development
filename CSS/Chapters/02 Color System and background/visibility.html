<!DOCTYPE html>
<html lang="en">
<head>
  <title>Visibility</title>
  
  <style>
    div {
      Height: 50px;
      width: 50px;
    }
    #box1{
      background-color: red;
      visibility: hidden;
    }
    #box2{
      background-color: green;
      visibility: visible;
    }
   
  </style>
</head>
<body>
  <div id="box1">Box1</div>
  <br>
  <div id="box2">Box2</div>
  
</body>
</html>
