<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Float Properties</title>
  <style>
    #container {
      width: 400px;
      height: 200px;
      border: 2px solid black;
      position: relative;
    }
    #box1 {
      width: 100px;
      height: 100px;
      background-color: lightblue;
      float: right;
      margin: 5px;
    }
    #box2 {
      width: 100px;
      height: 100px;
      background-color: lightgreen;
      float: left;
      margin: 5px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="box1">Box1</div>
    <div id="box2">Box2</div>
  </div>
</body>
</html>
