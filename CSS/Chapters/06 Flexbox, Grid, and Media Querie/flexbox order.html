<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Properties</title>
  <style>
    #container {
      width: 600px;
      height: 800px;
      background-color: azure;
      border: 2px solid black;
      display: flex; 
      
      align-items: center; 
      align-content: center; 
    }
    .box {
      width: 500px;
      height: 100px;
     
      margin: 5px;
      border: 3px solid black;
    }
    #box1 {
      background-color: purple;
      order: 3; /* Change the order of this item */
    }
    #box2 {
      background-color: blueviolet;
      order: 4; /* Change the order of this item */
    }
    #box3 {
      background-color: orange;
      order: 1; /* Change the order of this item */
    }
    #box4 {
      background-color: coral;
      order: 2; /* Change the order of this item */
    }
    
   
  </style>
</head>
<body>
  <h1>Flexbox Properties Example</h1>
  <div id="container">
    <div id="box1" class="box">Item 1</div>
    <div id="box2" class="box">Item 2</div>
    <div id="box3" class="box">Item 3</div>
    <div id="box4" class="box">Item 4</div>

  </div>
</body>
</html>
