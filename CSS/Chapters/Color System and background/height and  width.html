<!DOCTYPE html>
<html lang="en">
<head>
  <title>Height and width</title>
  
  <style>
    div {
      Height: 50px;
      width: 50px;
    }
    #box1{
      background-color: red;
    }
    #box2{
      background-color: green;
    }
    #box3{
      background-color: blue;
    }
  </style>
</head>
<body>
  <div id="box1">Box1</div>
  <br>
  <div id="box2">Box2</div>
  <br>
  <div id="box3">Box3</div>
  
</body>
</html>
