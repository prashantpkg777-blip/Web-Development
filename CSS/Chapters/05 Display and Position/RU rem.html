<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relative Unit: rem</title>
  <style>
    *{
      font-size: 16px;
    }
    #firstbox {
      height: 200px;
      width: 200px;
      font-size: 10px;
      background-color: lightblue;
     
    }
    #secondbox {
      height: 50%;
      width: 40%;
      font-size: 1.5rem; /* 1.5 times the font size of the root element */
      background-color: lightcoral;
    }
  </style>
</head>
<body>
  Body font
  <div id="firstbox">First Box 
    <div id="secondbox">Second Box</div>
  </div>
</body>
</html>
