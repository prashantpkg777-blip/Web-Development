<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Properties</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .box {
      height: 100px;
      width: 100px;
      margin: 10px;
      background-color: aqua;
      border: 5px dotted black;
    }
    #box1 {
      position: static;
      /* this is the default position */
    }
    #box2 {
      position: relative;
      top: 50px;
      left: 60px;
      /* this moves the element relative to its normal position */
    }
    #box3 {
      position: absolute;
      top: 200px;
      left: 200px;
      /* this moves the element relative to its nearest positioned ancestor, or the initial containing block if there is no positioned ancestor */
    }
    #box4 {
      position: fixed;
      top: 300px;
      left: 300px;
      /* this moves the element relative to the viewport, and it stays in that position even when the page is scrolled */
    }
  </style>
</head>
<body>
  <h1>Position Properties</h1>
  <div id="box1" class="box">Static</div>
  <div id="box2" class="box">Relative</div>
  <div id="box3" class="box">Absolute</div>
  <div id="box4" class="box">Fixed</div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div> 
  
</body>
</html>
