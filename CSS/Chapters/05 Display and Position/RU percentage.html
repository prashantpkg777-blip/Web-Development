<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relative Unit: Percentage</title>
  <style>
    #firstbox {
      height: 200px;
      width: 200px;
      background-color: lightblue;
     
    }
    #secondbox {
      height: 50%;
      width: 40%;
      background-color: lightcoral;
    }
  </style>
</head>
<body>
  <div id="firstbox">First Box 
    <div id="secondbox">Second Box</div>
  </div>
</body>
</html>
