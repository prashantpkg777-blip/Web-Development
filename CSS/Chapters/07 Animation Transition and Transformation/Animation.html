<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      left: 10px;
      background-color: lightblue;
      margin: 20px;
      border: 5px solid black;
      border-radius: 20px;
      text-align: center;
      line-height: 100px;
      display: inline-block;
      position: relative;
      }

    @keyframes ghumughumu {
      from {left: 10px; background-color: lightblue;}
      to {left: 1200px; background-color: lightgreen;}
    }
    @keyframes ghumakkad {
      0% {left: 10px; top: 10px; background-color: lightblue;}
      50% {left: 600px; top: 200px; background-color: lightcoral;}
      100% {left: 1200px; top: 10px; background-color: lightgreen;}
      
    }

    #box1 {
      animation-name: ghumughumu;
      animation-duration: 2s;
      animation-iteration-count: infinite;
      animation-delay: 1s;
      animation-direction: alternate;
      animation-timing-function: ease-in-out;

      /* animation: ghumughumu 2s ease-in-out 1s infinite alternate; */
    }

    #box2 {
      animation-name: ghumakkad;
      animation-duration: 4s;
      animation-iteration-count: infinite;
      animation-delay: 0.5s;
      animation-direction: alternate;
      animation-timing-function: ease-in-out;
    }
   
  </style>
</head>
<body>
    <div id="box1" class="box">Animated 1</div>
    <div id="box2" class="box">Animated 2</div>
</body>
</html>
