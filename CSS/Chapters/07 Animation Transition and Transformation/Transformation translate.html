<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformation</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background-color: lightblue;
      margin: 20px;
      border: 5px solid black;
      border-radius: 20px;
      text-align: center;
      line-height: 100px;
      display: inline-block;
      transition: all 0.5s ease-in-out;
    }
   
    #box1:hover {
      transform: translateX(50px);
    }

    #box2:hover {
      transform: translateY(-50px);
    }
    #box3:hover {
      transform: translate(45px, 45px);
    }
    #box4:hover {
      transform: translate(-45px, -45px);
    }
  </style>
</head>
<body>
    <div id="box1" class="box">Translate X</div>
    <div id="box2" class="box">Translate Y</div>
    <div id="box3" class="box">Translate Both</div>
    <div id="box4" class="box">Translate Negative</div>
</body>
</html>
