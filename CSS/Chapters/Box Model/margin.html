<!DOCTYPE html>
<html lang="en">
<head>
  <title>Margin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .pad {
      height: 100px;
      width: 200px;      
    }
    #first {
      padding: 10px;
      margin: 20px;
      background-color: lightgreen;
    }
    #second {
      padding: 30px;
      margin: 5px;
      background-color: lightcoral;
    }


  </style>
</head>
<body>
  <div id="first" class="pad"><h1>First box</h1></div>
  <div id="second" class="pad"><h1>Second box</h1></div>
  
</body>
</html>
