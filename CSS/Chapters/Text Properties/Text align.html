<!DOCTYPE html>
<html lang="en">
<head>
  <title>Text Align</title>
  
  <style>
    div {
      Height: 150px;
      width: 150px;
    }
    #box1{
      background-color: red;text-align: right;
    }
    #box2{
      background-color: green;text-align: center;
    }
    #box3{
      background-color: blue;text-align: left;
    }
  </style>
</head>
<body>
  <div id="box1">Box1</div>
  <br>
  <div id="box2">Box2</div>
  <br>
  <div id="box3">Box3</div>
  
</body>
</html>
