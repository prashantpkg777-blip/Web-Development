<!DOCTYPE html>
<html lang="en">
<head>
  <title>Text Decoration</title>
  
  <style>
    
    #box1{
      background-color: red; text-decoration: line-through;
    }
    #box2{
      background-color: green; text-decoration: underline;
    }
    #box3{
      background-color: blue; text-decoration: overline;
    }
  </style>
</head>
<body>
  <h1><div id="box1">Box1</div>
  <br>
  <div id="box2">Box2</div>
  <br>
  <div id="box3">Box3</div></h1>
  
  
</body>
</html>
