<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Myntra Clone</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>
<header>

  <div class="logo">
    <img class="logo_img" src="Image/myntra_logo.webp" alt="Myntra Logo">
  </div>

  <nav class="nav_bar">
    <a href="#">Men</a>
    <a href="#">Women</a>
    <a href="#">Kids</a>
    <a href="#">Home & Living</a>
    <a href="#">Beauty</a>
    <a href="#">Studio <sup class="super">New</sup></a>
  </nav>

  <div class="search_bar">
    <span class="material-symbols-outlined search_icon">search</span>
    <input class="search_input" placeholder="Search for products, brands and more">
  </div>

<div class="icons">
  <div class="icon_container">

    <div id="icon_profile" class="icon_item">
      <span class="material-symbols-outlined">person</span>
      <span>Profile</span>
    </div>

    <div id="icon_wishlist" class="icon_item">
      <span class="material-symbols-outlined">favorite</span>
      <span>Wishlist</span>
    </div>

    <div id="icon_bag" class="icon_item">
      <span class="material-symbols-outlined">shopping_bag</span>
      <span>Bag</span>
    </div>

  </div>
</div>

</header>
  <main></main>
  <footer></footer>
</body>
</html>
